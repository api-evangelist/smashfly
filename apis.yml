name: Smashfly
description: 'SmashFly Technologies was a recruitment-marketing software company whose
  Total Recruitment Marketing Platform combined a career-site CMS, a candidate CRM,
  programmatic job advertising, and recruiting analytics for enterprise talent-acquisition
  teams. Backed by Bessemer Venture Partners, SmashFly was acquired by Symphony Talent
  in 2019 and its product folded into the Symphony Talent (SFX / SmashFlyX) suite.
  SmashFly historically exposed RESTful integration APIs — a Job Import API, a Contact
  Import API, a Contact Export API, and a List Lookup API — secured with per-organization
  API keys generated by an administrator in the SmashFly Console. The standalone developer
  documentation at recruit.smashfly.com has since been retired (the host now returns
  an empty 302), smashfly.com redirects to symphonytalent.com, and the remaining SmashFly
  developer resources are hosted in the Symphony Talent support center.'
